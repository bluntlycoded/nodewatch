<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nodewatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ground:'var(--c-ground)', paper:'var(--c-paper)', rule:'var(--c-rule)',
            hairline:'var(--c-hairline)', ink:'var(--c-ink)', muted:'var(--c-muted)',
            healthy:'var(--c-healthy)', degraded:'var(--c-degraded)',
            down:'var(--c-down)', pending:'var(--c-pending)', signal:'var(--c-signal)' },
  fontFamily: { sans:['"IBM Plex Sans"','system-ui','sans-serif'],
                mono:['"IBM Plex Mono"','ui-monospace','monospace'] } } } }
</script>
<style>
  :root {
    --c-ground:#E4E7EB; --c-paper:#FFFFFF; --c-rule:#C9D0D8; --c-hairline:#DFE4E9;
    --c-ink:#16202B; --c-muted:#5C6B7A; --c-healthy:#0F7B6C; --c-degraded:#B07314;
    --c-down:#A93226; --c-pending:#7A8896; --c-signal:#1F4BD8;
    --grid: rgba(22,32,43,.028);
  }
  /* Not an inversion: the instrument palette is re-mixed for a dark ground so
     status colours keep their separation instead of glowing. */
  [data-theme="dark"] {
    --c-ground:#0E141A; --c-paper:#171F28; --c-rule:#2B3641; --c-hairline:#222B35;
    --c-ink:#DFE6ED; --c-muted:#8593A2; --c-healthy:#3FB39B; --c-degraded:#D6A247;
    --c-down:#E1685C; --c-pending:#7E8C9A; --c-signal:#7C9CFF;
    --grid: rgba(223,230,237,.035);
  }
  body {
    background:
      repeating-linear-gradient(0deg,  transparent 0 27px, var(--grid) 27px 28px),
      repeating-linear-gradient(90deg, transparent 0 27px, var(--grid) 27px 28px),
      var(--c-ground);
    color: var(--c-ink);
  }
  input, select { background: var(--c-paper); color: var(--c-ink) }
  input::placeholder { color: var(--c-muted); opacity:.75 }
  .rise { animation: rise .22s ease-out both }
  @keyframes rise { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
  .live::after { content:''; position:absolute; inset:0; border-radius:9999px;
                 box-shadow:0 0 0 0 currentColor; animation:ping 2.6s ease-out infinite }
  @keyframes ping { 70%,100%{box-shadow:0 0 0 6px transparent} }
  :focus-visible { outline:2px solid #1F4BD8; outline-offset:2px }
  ::-webkit-scrollbar { width:10px;height:10px }
  ::-webkit-scrollbar-thumb { background:var(--c-rule) }
  ::-webkit-scrollbar-track { background:transparent }
  @media (prefers-reduced-motion:reduce){ .rise,.live::after{animation:none!important} }
</style>
<script>
  // Runs before paint. Falls back to in-memory if storage is unavailable.
  (function(){
    var t='light';
    try { t = localStorage.getItem('nw-theme')
              || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e){}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body class="font-sans antialiased">

<!-- ════════════════════ sign in ════════════════════ -->
<div id="gate" class="min-h-screen flex items-center justify-center px-5">
  <div class="w-full max-w-sm bg-paper border border-rule">
    <div class="border-b border-rule px-6 py-5">
      <p class="font-mono text-[10px] tracking-[.22em] text-muted uppercase">Fleet telemetry</p>
      <h1 class="text-2xl font-semibold tracking-tight mt-1">nodewatch</h1>
    </div>
    <div class="px-6 py-6 space-y-4">
      <p class="text-sm text-muted leading-relaxed">Telemetry is protected by row-level security. Sign in to read it.</p>
      <div>
        <label for="email" class="font-mono text-[10px] tracking-[.18em] uppercase text-muted">Email</label>
        <input id="email" type="email" autocomplete="username"
               class="mt-1 w-full border border-rule px-3 py-2 font-mono text-sm focus:border-signal outline-none">
      </div>
      <div>
        <label for="pw" class="font-mono text-[10px] tracking-[.18em] uppercase text-muted">Password</label>
        <input id="pw" type="password" autocomplete="current-password"
               class="mt-1 w-full border border-rule px-3 py-2 font-mono text-sm focus:border-signal outline-none">
      </div>
      <button id="signin" class="w-full bg-ink text-paper py-2.5 text-sm font-medium hover:bg-signal transition-colors">Sign in</button>
      <p id="gate-msg" class="text-sm text-down min-h-[1.25rem]"></p>
    </div>
  </div>
</div>

<!-- ════════════════════ app ════════════════════ -->
<div id="app" class="hidden min-h-screen lg:flex">

  <!-- nav rail: fixed drawer under lg, static column at lg and up -->
  <div id="scrim" class="hidden lg:hidden fixed inset-0 bg-ink/50 z-30"></div>
  <aside id="rail"
    class="fixed lg:sticky top-0 left-0 z-40 h-screen w-56 shrink-0 bg-paper border-r border-rule
           flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="px-5 py-5 border-b border-rule flex items-start justify-between">
      <div>
        <h1 class="text-xl font-semibold tracking-tight leading-none">nodewatch</h1>
        <p class="font-mono text-[9px] tracking-[.2em] uppercase text-muted mt-1">fleet telemetry</p>
      </div>
      <button id="railclose" class="lg:hidden font-mono text-xs text-muted hover:text-ink px-1" aria-label="Close menu">✕</button>
    </div>
    <nav id="nav" class="flex-1 py-2 overflow-y-auto"></nav>
    <div class="border-t border-rule px-5 py-3 space-y-2">
      <button id="theme" class="w-full flex items-center justify-between font-mono text-[10px] uppercase tracking-[.14em] text-muted hover:text-ink">
        <span id="theme-label">Dark mode</span>
        <span id="theme-dot" class="w-8 h-4 border border-rule relative inline-block">
          <span id="theme-knob" class="absolute top-0.5 left-0.5 w-3 h-3 bg-muted transition-all"></span>
        </span>
      </button>
      <p class="font-mono text-[10px] text-muted tabular-nums">updated <span id="clock">—</span></p>
      <button id="signout" class="font-mono text-[10px] uppercase tracking-[.14em] text-muted hover:text-signal">Sign out</button>
    </div>
  </aside>

  <!-- page -->
  <main class="flex-1 min-w-0">
    <header class="sticky top-0 z-20 bg-ground/95 backdrop-blur border-b border-rule">
      <div class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button id="railopen" class="lg:hidden font-mono text-lg leading-none px-1 -ml-1" aria-label="Open menu">☰</button>
          <div class="min-w-0">
          <h2 id="page-title" class="text-lg sm:text-xl font-semibold tracking-tight leading-none truncate">Servers</h2>
          <p id="page-sub" class="font-mono text-[10px] text-muted mt-1 truncate"></p>
          </div>
        </div>
        <div id="page-actions" class="flex items-center gap-2 shrink-0"></div>
      </div>
    </header>
    <div id="page" class="px-4 sm:px-6 lg:px-8 py-5 sm:py-6"></div>
    <p id="err" class="px-4 sm:px-6 lg:px-8 pb-6 font-mono text-xs text-down"></p>
  </main>
</div>

<!-- ════════════════════ node settings modal ════════════════════ -->
<div id="modal" class="hidden fixed inset-0 bg-ink/45 items-center justify-center px-5 z-50">
  <div class="bg-paper border border-rule w-full max-w-lg max-h-[88vh] overflow-y-auto">
    <div class="flex items-start justify-between border-b border-rule px-6 py-4">
      <div>
        <p class="font-mono text-[10px] tracking-[.22em] uppercase text-muted" id="m-eyebrow">Node settings</p>
        <h2 class="text-xl font-semibold tracking-tight mt-0.5" id="m-title">—</h2>
      </div>
      <button id="m-close" class="font-mono text-xs text-muted hover:text-ink px-2">Close</button>
    </div>
    <div class="px-6 py-5 space-y-5">
      <div id="m-idfield" class="hidden">
        <label class="font-mono text-[10px] tracking-[.18em] uppercase text-muted">EC2 instance ID</label>
        <input id="m-instance" placeholder="i-0abc123..." spellcheck="false"
               class="mt-1 w-full border border-rule px-3 py-2 font-mono text-sm focus:border-signal outline-none">
        <p class="text-xs text-muted mt-1">Shows as <span class="font-mono">pending</span> until its agent first reports.</p>
      </div>
      <div>
        <label class="font-mono text-[10px] tracking-[.18em] uppercase text-muted">Display name</label>
        <input id="m-name" placeholder="nw-node-1"
               class="mt-1 w-full border border-rule px-3 py-2 font-mono text-sm focus:border-signal outline-none">
      </div>
      <div>
        <label class="font-mono text-[10px] tracking-[.18em] uppercase text-muted">Notes</label>
        <input id="m-notes" placeholder="What this node is for"
               class="mt-1 w-full border border-rule px-3 py-2 text-sm focus:border-signal outline-none">
      </div>
      <label class="flex items-center gap-2 cursor-pointer">
        <input id="m-muted" type="checkbox" class="accent-ink">
        <span class="text-sm">Mute alerts for this node</span>
      </label>
      <div id="m-mailwrap">
        <div class="flex items-baseline justify-between">
          <label class="font-mono text-[10px] tracking-[.18em] uppercase text-muted">Alert recipients</label>
          <span class="font-mono text-[10px] text-muted" id="m-count">0 of 5</span>
        </div>
        <div id="m-emails" class="mt-2 border border-rule divide-y divide-hairline"></div>
        <div class="flex gap-2 mt-2">
          <input id="m-newmail" type="email" placeholder="name@example.com"
                 class="flex-1 border border-rule px-3 py-2 font-mono text-sm focus:border-signal outline-none">
          <button id="m-addmail" class="bg-ink text-paper px-4 text-sm hover:bg-signal transition-colors">Add</button>
        </div>
      </div>
      <p id="m-msg" class="text-sm text-down min-h-[1.25rem]"></p>
      <div class="flex gap-2 pt-1">
        <button id="m-save" class="flex-1 bg-ink text-paper py-2.5 text-sm font-medium hover:bg-signal transition-colors">Save</button>
        <button id="m-cancel" class="px-5 border border-rule text-sm hover:border-ink transition-colors">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════ config
const SUPABASE_URL = "https://jcprvuqhnjtgskjuoded.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjcHJ2dXFobmp0Z3NranVvZGVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MzEzNjMsImV4cCI6MjEwMjQwNzM2M30.7PH62L3s5SLTHXBhs-yvdcjXs_QiT2ILg1H6ZJpfefk";
const POLL_MS = 10000, TRACE_POINTS = 44;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
// Read from CSS variables so status colours re-mix with the theme rather
// than staying pinned to the light palette.
function themeColour(name){
  return getComputedStyle(document.documentElement)
           .getPropertyValue('--c-' + name).trim() || '#5C6B7A';
}
const HEX = new Proxy({}, { get: (_, k) => themeColour(String(k)) });

const PAGES = [
  ['servers','Servers'], ['alerts','Alerts'], ['activity','Activity'],
  ['posture','Posture'], ['vulns','Vulnerabilities'], ['settings','Settings'],
];

let state = {
  page:'servers', tab:'ports', filter:'all', query:'', alertFilter:'all',
  host:null, hostTab:'checks',
  hosts:[], metrics:{}, series:{}, alerts:[], ports:[], users:[], auth:[],
  checks:[], recipients:[], rules:[], fim:[], tokens:[], history:[], vulns:[],
  hostDetail:{ checks:[], packages:[], vulns:[], users:[], ports:[], fim:[], history:[] },
};

// ═══════════════════════════ helpers
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(iso) {
  if (!iso) return '—';
  const s = Math.max(0,(Date.now()-new Date(iso))/1000);
  if (s<60) return Math.floor(s)+'s';
  if (s<3600) return Math.floor(s/60)+'m';
  if (s<86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}
function uptime(sec){
  if (sec==null) return '—';
  const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600);
  return d?`${d}d ${h}h`:`${h}h ${Math.floor(sec%3600/60)}m`;
}
const trustColour = t => t==null?themeColour('pending') : t>=70?themeColour('healthy')
  : t>=40?themeColour('degraded') : themeColour('down');
const nameOf = id => (state.hosts.find(h=>h.id===id)||{}).label || '—';
const empty = t => `<p class="px-5 py-12 text-center text-sm text-muted">${t}</p>`;
const card = inner => `<div class="bg-paper border border-rule">${inner}</div>`;
const sectionHead = (t, extra='') =>
  `<div class="flex items-center justify-between px-5 py-3 border-b border-rule">
     <h3 class="font-mono text-[10px] tracking-[.2em] uppercase text-muted">${t}</h3>${extra}</div>`;

function trace(samples, colour) {
  const w=3, gap=1, h=24, pts=samples.slice(-TRACE_POINTS), pad=TRACE_POINTS-pts.length;
  const total=TRACE_POINTS*(w+gap);
  const bars=pts.map((v,i)=>{
    const bh=Math.max(4,Math.min(h,4+(v/100)*(h-4)));
    return `<rect x="${(pad+i)*(w+gap)}" y="${h-bh}" width="${w}" height="${bh}" fill="${colour}" opacity=".85"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${total} ${h}" preserveAspectRatio="none" class="w-full h-[24px]" role="img"
    aria-label="Recent heartbeats"><line x1="0" y1="${h-.5}" x2="${total}" y2="${h-.5}" stroke="${themeColour('hairline')}"/>${bars}</svg>`;
}

// Trust over time. The decay model is invisible in a single number; the
// line is what shows a host sliding rather than sitting.
function trustChart(points, w=680, h=140) {
  if (!points.length) return `<p class="px-5 py-10 text-center text-sm text-muted">
    No trust history yet. Samples are taken every 5 minutes.</p>`;
  const pad={l:34,r:12,t:12,b:22};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const t0=new Date(points[0].ts).getTime();
  const t1=new Date(points[points.length-1].ts).getTime();
  const span=Math.max(1,t1-t0);
  const x=p=>pad.l+((new Date(p.ts).getTime()-t0)/span)*iw;
  const y=v=>pad.t+ih-((v??0)/100)*ih;
  const path=points.map((p,i)=>`${i?'L':'M'}${x(p).toFixed(1)},${y(p.trust).toFixed(1)}`).join('');
  const area=`M${x(points[0]).toFixed(1)},${pad.t+ih} `+
    points.map(p=>`L${x(p).toFixed(1)},${y(p.trust).toFixed(1)}`).join('')+
    ` L${x(points[points.length-1]).toFixed(1)},${pad.t+ih} Z`;
  const grid=[0,25,50,75,100].map(v=>`
    <line x1="${pad.l}" y1="${y(v)}" x2="${w-pad.r}" y2="${y(v)}" stroke="${themeColour('hairline')}"/>
    <text x="${pad.l-6}" y="${y(v)+3}" text-anchor="end"
      font-family="IBM Plex Mono,monospace" font-size="8" fill="${themeColour('muted')}">${v}</text>`).join('');
  const last=points[points.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full" role="img" aria-label="Trust score over time">
    ${grid}
    <line x1="${pad.l}" y1="${y(70)}" x2="${w-pad.r}" y2="${y(70)}"
          stroke="${themeColour('down')}" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
    <text x="${w-pad.r}" y="${y(70)-4}" text-anchor="end"
      font-family="IBM Plex Mono,monospace" font-size="8" fill="${themeColour('down')}">re-verify below 70</text>
    <path d="${area}" fill="${trustColour(last.trust)}" opacity=".10"/>
    <path d="${path}" fill="none" stroke="${trustColour(last.trust)}" stroke-width="1.6"/>
    <circle cx="${x(last).toFixed(1)}" cy="${y(last.trust).toFixed(1)}" r="2.6" fill="${trustColour(last.trust)}"/>
    <text x="${pad.l}" y="${h-6}" font-family="IBM Plex Mono,monospace" font-size="8" fill="${themeColour('muted')}">${ago(points[0].ts)} ago</text>
    <text x="${w-pad.r}" y="${h-6}" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="8" fill="${themeColour('muted')}">now</text>
  </svg>`;
}

function trustBar(r) {
  return [['exp',r.f_exposure],['auth',r.f_auth],['chn',r.f_churn],
          ['pos',r.f_posture],['int',r.f_integrity]]
    .map(([l,v])=>`<div class="flex-1" title="${l} ${(v??0).toFixed(2)}">
      <div class="h-[3px] bg-hairline"><div class="h-[3px]"
        style="width:${Math.round((v??0)*100)}%;background:${v>=.8?HEX.healthy:v>=.5?HEX.degraded:HEX.down}"></div></div>
      <p class="font-mono text-[8px] tracking-[.1em] uppercase text-muted mt-0.5">${l}</p></div>`).join('');
}

// ═══════════════════════════ auth
$('signin').onclick = async () => {
  $('gate-msg').textContent='';
  const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('pw').value });
  if (error) { $('gate-msg').textContent = error.message; return; }
  enter();
};
$('pw').addEventListener('keydown', e => { if(e.key==='Enter') $('signin').click(); });
$('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

function enter(){
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  const h=(location.hash||'').replace('#/','');
  if (h.startsWith('host/')) { state.page='host'; state.host=h.slice(5); }
  else if (h==='overview'||h==='nodes') state.page='servers';
  else if (PAGES.some(([k])=>k===h)) state.page=h;
  applyThemeLabel();
  refresh(); setInterval(refresh, POLL_MS);
}
sb.auth.getSession().then(({data})=>{ if(data.session) enter(); });

// ═══════════════════════════ theme
function applyThemeLabel(){
  const dark = currentTheme() === 'dark';
  if ($('theme-label')) $('theme-label').textContent = dark ? 'Light mode' : 'Dark mode';
  if ($('theme-knob'))  $('theme-knob').style.left = dark ? '1.125rem' : '0.125rem';
}
function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'light'; }
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('nw-theme', t); } catch(e) { /* private mode */ }
  const dark = t === 'dark';
  if ($('theme-label')) $('theme-label').textContent = dark ? 'Light mode' : 'Dark mode';
  if ($('theme-knob'))  $('theme-knob').style.left = dark ? '1.125rem' : '0.125rem';
  // Inline SVG and status colours are set from JS, so re-render after a swap.
  if (state.hosts.length) render();
}
$('theme').onclick = () => applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');

// ═══════════════════════════ drawer
function openRail(){ $('rail').classList.remove('-translate-x-full');
                     $('scrim').classList.remove('hidden'); }
function closeRail(){ $('rail').classList.add('-translate-x-full');
                      $('scrim').classList.add('hidden'); }
$('railopen').onclick = openRail;
$('railclose').onclick = closeRail;
$('scrim').onclick = closeRail;

// ═══════════════════════════ nav
function badges(){
  const down = state.hosts.filter(h=>h.status==='down').length;
  const failedMail = state.alerts.filter(a=>a.status==='failed'||(!a.acknowledged_at&&!a.resolved_at&&a.severity==='critical')).length;
  const highChecks = state.checks.filter(c=>c.severity==='high').length;
  const severeVulns = state.vulns.filter(v=>v.severity==='critical'||v.severity==='high').length;
  const critFiles = state.fim.filter(f=>f.critical).length;
  return { servers:down, alerts:failedMail, posture:highChecks,
           vulns:severeVulns, activity:critFiles };
}
function renderNav(){
  const b=badges();
  $('nav').innerHTML = PAGES.map(([k,label])=>`
    <button data-page="${k}" class="w-full text-left px-5 py-2.5 flex items-center justify-between
      font-mono text-[11px] uppercase tracking-[.14em] border-l-2 transition-colors
      ${state.page===k ? 'border-ink bg-ground text-ink' : 'border-transparent text-muted hover:text-ink'}">
      <span>${label}</span>
      ${b[k] ? `<span class="text-down">${b[k]}</span>` : ''}
    </button>`).join('');
  $('nav').querySelectorAll('[data-page]').forEach(el =>
    el.onclick = () => { state.page = el.dataset.page; location.hash = '#/'+el.dataset.page;
                         closeRail(); render(); });
}
window.addEventListener('hashchange', ()=>{
  const h=(location.hash||'').replace('#/','');
  if (PAGES.some(([k])=>k===h) && h!==state.page) { state.page=h; render(); }
});

// ═══════════════════════════ page: servers (landing)
function pageServers(){
  const h=state.hosts, c={healthy:0,degraded:0,down:0,pending:0};
  h.forEach(r=>c[r.status]!==undefined&&c[r.status]++);
  const scored=h.filter(r=>r.trust!=null);
  const avg=scored.length?Math.round(scored.reduce((a,r)=>a+r.trust,0)/scored.length):null;
  const day=Date.now()-86400000;
  const recent=state.alerts.filter(a=>new Date(a.created_at)>day);
  const failedMail=recent.filter(a=>a.status==='failed').length;

  // Anything a person needs to act on. Shown only when non-empty: an
  // always-present panel that usually says "nothing" trains people to skip it.
  const attention=[];
  h.filter(r=>r.status==='down').forEach(r=>attention.push(['critical',r.id,`${r.label} has stopped reporting`,`last seen ${ago(r.last_seen)} ago`]));
  h.filter(r=>r.critical_file_changes_24h>0).forEach(r=>attention.push(['critical',r.id,`Security-critical file changed on ${r.label}`,`${r.critical_file_changes_24h} in 24h`]));
  h.filter(r=>r.priv_changes_24h>0).forEach(r=>attention.push(['critical',r.id,`Privileged account change on ${r.label}`,`${r.priv_changes_24h} in 24h`]));
  h.filter(r=>r.needs_reverification&&r.status!=='down').forEach(r=>attention.push(['warning',r.id,`${r.label} is below the trust threshold`,`trust ${r.trust}`]));
  h.filter(r=>r.checks_failed_high>0).forEach(r=>attention.push(['warning',r.id,`${r.checks_failed_high} high-severity check(s) failing on ${r.label}`,'']));
  h.filter(r=>r.vulns_severe>0).forEach(r=>attention.push(['warning',r.id,`${r.vulns_severe} severe vulnerabilit${r.vulns_severe===1?'y':'ies'} on ${r.label}`,'']));
  h.filter(r=>r.recipient_count===0).forEach(r=>attention.push(['info',r.id,`${r.label} has no alert recipients`,'alerts go nowhere']));
  if (failedMail) attention.push(['critical',null,`${failedMail} alert email(s) failed to send`,'see Alerts']);

  const tone={critical:'text-down',warning:'text-degraded',info:'text-muted'};

  const rows=h.filter(r=>{
    if(state.filter!=='all'&&r.status!==state.filter) return false;
    if(!state.query) return true;
    return `${r.label} ${r.instance_id} ${r.hostname||''}`.toLowerCase().includes(state.query);
  });

  const pill=(label,n,colour)=>`
    <div class="flex items-baseline gap-1.5">
      <span class="text-lg font-semibold tabular-nums leading-none" style="color:${colour||'var(--c-ink)'}">${n}</span>
      <span class="font-mono text-[9px] tracking-[.16em] uppercase text-muted">${label}</span>
    </div>`;

  return `
  <div class="space-y-5">
    <!-- status strip -->
    <div class="bg-paper border border-rule px-4 sm:px-5 py-3 flex flex-wrap items-center gap-x-6 gap-y-3">
      ${pill('servers',h.length)}
      ${pill('healthy',c.healthy,'var(--c-healthy)')}
      ${pill('degraded',c.degraded,c.degraded?'var(--c-degraded)':null)}
      ${pill('down',c.down,c.down?'var(--c-down)':null)}
      ${c.pending?pill('pending',c.pending,'var(--c-pending)'):''}
      ${pill('mean trust',avg??'—',trustColour(avg))}
      <span class="flex-1"></span>
      <div id="chips" class="flex"></div>
    </div>

    ${attention.length?`
    <div class="bg-paper border border-rule">
      <div class="flex items-center justify-between px-4 sm:px-5 py-2.5 border-b border-rule">
        <h3 class="font-mono text-[10px] tracking-[.2em] uppercase text-muted">Needs attention</h3>
        <span class="font-mono text-[10px] text-down">${attention.length}</span>
      </div>
      <div class="divide-y divide-hairline max-h-56 overflow-y-auto">${attention.map(([sev,id,title,sub])=>`
        <div ${id?`data-jump="${id}"`:''} class="flex items-baseline gap-3 px-4 sm:px-5 py-2 ${id?'cursor-pointer hover:bg-ground':''}">
          <span class="font-mono text-[10px] uppercase tracking-[.12em] w-14 shrink-0 ${tone[sev]}">${sev}</span>
          <span class="text-sm flex-1 min-w-0 truncate">${esc(title)}</span>
          <span class="font-mono text-[10px] text-muted shrink-0 hidden sm:inline">${esc(sub)}</span>
        </div>`).join('')}</div>
    </div>`:''}

    <!-- server list -->
    ${rows.length?`<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">${rows.map(serverCard).join('')}</div>`
      : card(empty(h.length?'No servers match this filter.'
        :'No servers yet. Launch one from the nodewatch-node template and it appears within a minute.'))}
  </div>`;
}

function serverCard(r){
  const st=HEX[r.status]?r.status:'down', m=state.metrics[r.id]||{};
  return `<article data-agent="${r.id}" tabindex="0" role="button"
    aria-label="Open ${esc(r.label)}"
    class="bg-paper border border-rule rise cursor-pointer hover:border-ink transition-colors flex flex-col">
    <div class="flex items-start justify-between gap-3 px-4 pt-3.5">
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span class="relative inline-block w-2 h-2 rounded-full shrink-0 ${st==='healthy'?'live':''}"
                style="background:${HEX[st]};color:${HEX[st]}"></span>
          <h3 class="font-semibold tracking-tight truncate">${esc(r.label)}</h3>
          ${r.muted?'<span class="font-mono text-[9px] uppercase tracking-[.12em] text-muted border border-rule px-1 shrink-0">muted</span>':''}
        </div>
        <p class="font-mono text-[10px] text-muted mt-1 truncate">${esc(r.instance_id)} · ${esc(r.region||'—')}</p>
      </div>
      <div class="text-right shrink-0">
        <p class="text-3xl font-semibold tabular-nums leading-none" style="color:${trustColour(r.trust)}">${r.trust??'—'}</p>
        <p class="font-mono text-[9px] tracking-[.16em] uppercase" style="color:${HEX[st]}">${st}</p>
      </div>
    </div>
    <div class="px-4 pt-2.5">${trace(state.series[r.id]||[],HEX[st])}</div>
    <div class="px-4 pt-2 flex gap-1.5">${trustBar(r)}</div>
    <dl class="grid grid-cols-4 border-t border-hairline mt-3 divide-x divide-hairline">
      ${[['cpu',m.cpu_pct!=null?m.cpu_pct.toFixed(0)+'%':'—'],
         ['mem',m.mem_pct!=null?m.mem_pct.toFixed(0)+'%':'—'],
         ['up',uptime(m.uptime_s)],['ext',r.external_ports??0]].map(([k,v])=>`
        <div class="px-2.5 py-1.5"><dt class="font-mono text-[8px] tracking-[.14em] uppercase text-muted">${k}</dt>
        <dd class="font-mono text-[13px] tabular-nums">${v}</dd></div>`).join('')}
    </dl>
    ${flags(r)}
    <div class="border-t border-hairline px-4 py-1.5 flex items-center justify-between mt-auto">
      <span class="font-mono text-[10px] ${r.recipient_count?'text-muted':'text-down'}">${r.recipient_count||0} recipient${r.recipient_count===1?'':'s'}</span>
      <span class="font-mono text-[10px] text-muted tabular-nums">seen ${ago(r.last_seen)} ago</span>
    </div>
  </article>`;
}

function statusPill(s){
  const m={sent:['text-healthy','sent'],failed:['text-down','failed'],
           suppressed:['text-muted','suppressed'],pending:['text-signal','queued'],
           sending:['text-signal','sending']};
  const [cls,label]=m[s]||['text-muted',s];
  return `<span class="font-mono text-[10px] uppercase tracking-[.12em] shrink-0 w-20 text-right ${cls}">${esc(label)}</span>`;
}

function flags(r){
  const out=[];
  if(r.critical_file_changes_24h>0) out.push([`${r.critical_file_changes_24h} critical file change${r.critical_file_changes_24h>1?'s':''}`,'text-down']);
  if(r.priv_changes_24h>0) out.push([`${r.priv_changes_24h} privileged account change${r.priv_changes_24h>1?'s':''}`,'text-down']);
  if(r.failed_logins_1h>0) out.push([`${r.failed_logins_1h} failed sign-in${r.failed_logins_1h>1?'s':''} (1h)`,'text-down']);
  if(r.checks_failed>0) out.push([`${r.checks_failed} check${r.checks_failed>1?'s':''} failing${r.checks_failed_high?` · ${r.checks_failed_high} high`:''}`,
    r.checks_failed_high?'text-down':'text-degraded']);
  if(r.vulns_severe>0) out.push([`${r.vulns_severe} severe CVE${r.vulns_severe>1?'s':''}`,'text-down']);
  if(!out.length) return '';
  return `<div class="border-t border-hairline px-4 py-1.5 space-y-0.5">
    ${out.map(([t,c])=>`<p class="font-mono text-[10px] ${c}">${t}</p>`).join('')}</div>`;
}

// ═══════════════════════════ page: host detail
const HOST_TABS = [['checks','Posture'],['packages','Packages'],['fim','File changes'],
                   ['users','Accounts'],['ports','Ports'],['history','Trust history']];

function pageHost(){
  const r = state.hosts.find(h=>h.id===state.host);
  if(!r) return card(empty('That node no longer exists.'));
  const d = state.hostDetail, m = state.metrics[r.id]||{};
  const st = HEX[r.status]?r.status:'down';

  const stat=(label,val,colour)=>`
    <div class="px-4 py-3">
      <dt class="font-mono text-[9px] tracking-[.16em] uppercase text-muted">${label}</dt>
      <dd class="font-mono text-base tabular-nums mt-1" style="color:${colour||'var(--c-ink)'}">${val}</dd>
    </div>`;

  const counts={checks:d.checks.length,packages:d.packages.length,fim:d.fim.length,
                users:d.users.length,ports:d.ports.length,history:d.history.length};
  const tabs=HOST_TABS.map(([k,l])=>`
    <button data-hosttab="${k}" class="font-mono text-[11px] uppercase tracking-[.14em] px-4 py-2.5 border border-b-0 -mb-px
      ${state.hostTab===k?'bg-paper border-rule text-ink':'border-transparent text-muted hover:text-ink'}">
      ${l} <span class="text-muted">${counts[k]||0}</span></button>`).join('');

  return `
  <div class="space-y-5">
    <div class="flex items-center gap-3">
      <button data-goto="nodes" class="font-mono text-[11px] uppercase tracking-[.14em] text-signal hover:underline">&larr; Nodes</button>
      <span class="font-mono text-[11px] text-muted">${esc(r.instance_id)}</span>
      ${r.muted?'<span class="font-mono text-[10px] uppercase tracking-[.12em] text-muted border border-rule px-1.5">muted</span>':''}
      <span class="flex-1"></span>
      <button data-agent="${r.id}" class="font-mono text-[11px] uppercase tracking-[.14em] border border-ink px-3 py-1.5 hover:bg-ink hover:text-white transition-colors">Settings</button>
    </div>

    <div class="grid lg:grid-cols-[300px_1fr] gap-5">
      ${card(`
        <div class="px-5 py-4 border-b border-rule">
          <div class="flex items-center gap-2">
            <span class="relative inline-block w-2 h-2 rounded-full ${st==='healthy'?'live':''}"
                  style="background:${HEX[st]};color:${HEX[st]}"></span>
            <h3 class="text-lg font-semibold tracking-tight truncate">${esc(r.label)}</h3>
          </div>
          <p class="font-mono text-[11px] text-muted mt-1">${esc(r.os||'—')}</p>
          ${r.notes?`<p class="text-[12px] text-muted mt-2">${esc(r.notes)}</p>`:''}
        </div>
        <div class="px-5 py-4 text-center border-b border-rule">
          <p class="text-5xl font-semibold tabular-nums leading-none" style="color:${trustColour(r.trust)}">${r.trust??'—'}</p>
          <p class="font-mono text-[10px] tracking-[.18em] uppercase text-muted mt-1.5">trust</p>
          ${r.needs_reverification?'<p class="font-mono text-[10px] text-down mt-2">below re-verification threshold</p>':''}
        </div>
        <div class="px-5 py-3 border-b border-rule flex gap-1.5">${trustBar(r)}</div>
        <dl class="grid grid-cols-2 divide-x divide-y divide-hairline">
          ${stat('cpu', m.cpu_pct!=null?m.cpu_pct.toFixed(0)+'%':'—')}
          ${stat('memory', m.mem_pct!=null?m.mem_pct.toFixed(0)+'%':'—')}
          ${stat('disk', m.disk_pct!=null?m.disk_pct.toFixed(0)+'%':'—')}
          ${stat('uptime', uptime(m.uptime_s))}
          ${stat('ext ports', r.external_ports??0, r.external_ports>1?HEX.degraded:null)}
          ${stat('failed logins 1h', r.failed_logins_1h??0, r.failed_logins_1h?HEX.down:null)}
          ${stat('files watched', r.files_watched??'—')}
          ${stat('packages', r.package_count??'—')}
          ${stat('severe CVEs', r.vulns_severe??0, r.vulns_severe?HEX.down:null)}
          ${stat('recipients', r.recipient_count??0, r.recipient_count?null:HEX.down)}
        </dl>
        <div class="px-5 py-2.5 border-t border-rule">
          <p class="font-mono text-[10px] text-muted">agent ${esc(r.agent_version||'—')} · seen ${ago(r.last_seen)} ago</p>
        </div>`)}

      <div>
        ${card(sectionHead('Trust over 24 hours') + `<div class="px-4 py-3">${trustChart(d.history)}</div>`)}
        <div class="flex items-center gap-1 border-b border-rule mt-5">${tabs}</div>
        <div class="bg-paper border border-rule border-t-0">${hostPane(d)}</div>
      </div>
    </div>
  </div>`;
}

function hostPane(d){
  const t=state.hostTab;
  if(t==='checks'){
    const tone={high:'text-down',medium:'text-degraded',low:'text-muted'};
    const ord={high:0,medium:1,low:2};
    const rows=[...d.checks].sort((a,b)=>(a.status===b.status?0:a.status==='fail'?-1:1)||ord[a.severity]-ord[b.severity]);
    return list(rows.map(c=>`<div class="px-5 py-2.5 rise">
      <div class="flex items-center gap-3">
        <span class="font-mono text-[10px] uppercase tracking-[.12em] w-14 shrink-0
          ${c.status==='pass'?'text-healthy':c.status==='error'?'text-muted':tone[c.severity]}">${c.status==='pass'?'pass':c.severity}</span>
        <span class="text-sm truncate flex-1 ${c.status==='pass'?'text-muted':''}">${esc(c.title)}</span>
        <span class="font-mono text-[10px] text-muted shrink-0">${esc(c.check_id)}</span>
      </div>
      <p class="font-mono text-[11px] text-muted mt-1 pl-[4.25rem] truncate">${esc(c.detail||'')}</p></div>`),
      'No posture checks recorded yet.');
  }
  if(t==='packages'){
    const vulnBy={}; d.vulns.forEach(v=>(vulnBy[v.name] ||= []).push(v));
    const rows=[...d.packages].sort((a,b)=>(vulnBy[b.name]?1:0)-(vulnBy[a.name]?1:0)||a.name.localeCompare(b.name));
    return list(rows.map(p=>{
      const vs=vulnBy[p.name]||[];
      const sev=vs.some(v=>v.severity==='critical')?'critical':vs.some(v=>v.severity==='high')?'high':vs.length?'other':null;
      return line(`
        <span class="font-mono text-sm w-52 truncate shrink-0">${esc(p.name)}</span>
        <span class="font-mono text-[11px] text-muted truncate flex-1">${esc(p.version)}</span>
        ${sev?`<span class="font-mono text-[10px] uppercase tracking-[.1em] shrink-0
          ${sev==='critical'||sev==='high'?'text-down':'text-degraded'}">${vs.length} ${sev==='other'?'known':sev}</span>`:''}`);
    }), 'No package inventory yet. Collected every 6 hours.');
  }
  if(t==='fim'){
    const tone={added:'text-signal',modified:'text-degraded',deleted:'text-down'};
    return list(d.fim.map(f=>`<div class="px-5 py-2.5 rise">
      <div class="flex items-center gap-3">
        <span class="font-mono text-[10px] uppercase tracking-[.12em] w-16 shrink-0 ${tone[f.action]}">${esc(f.action)}</span>
        <span class="font-mono text-sm truncate flex-1">${esc(f.path)}</span>
        ${f.critical?'<span class="font-mono text-[10px] uppercase tracking-[.1em] text-down shrink-0">critical</span>':''}
        <span class="font-mono text-[11px] text-muted tabular-nums w-10 text-right shrink-0">${ago(f.ts)}</span>
      </div>
      <p class="font-mono text-[11px] text-muted mt-1 pl-[5rem] truncate">${esc(f.detail||'')}${f.sha256?` · ${esc(f.sha256.slice(0,16))}`:''}</p></div>`),
      'No file changes detected. The baseline is recorded silently at first scan.');
  }
  if(t==='users'){
    return list(d.users.map(u=>line(`
      <span class="font-mono text-sm w-40 truncate shrink-0">${esc(u.username)}</span>
      <span class="font-mono text-[11px] text-muted w-16 tabular-nums shrink-0">uid ${u.uid??'—'}</span>
      ${u.sudoer?'<span class="font-mono text-[10px] uppercase tracking-[.1em] text-down shrink-0">sudo</span>':''}
      ${u.can_login?'<span class="font-mono text-[10px] uppercase tracking-[.1em] text-signal shrink-0">login</span>':''}
      <span class="font-mono text-[11px] text-muted truncate flex-1 text-right">${esc(u.shell||'')}</span>
      <span class="font-mono text-[10px] text-muted w-16 text-right shrink-0">pw ${esc(u.password||'?')}</span>`)),
      'No account inventory yet.');
  }
  if(t==='ports'){
    return list(d.ports.map(p=>line(`
      <span class="font-mono text-sm tabular-nums w-20 shrink-0">${p.port}/${esc(p.proto)}</span>
      <span class="font-mono text-[11px] text-muted w-32 truncate shrink-0">${esc(p.bind_addr)}</span>
      <span class="font-mono text-[11px] text-muted truncate flex-1">${esc(p.process||'unknown')}</span>
      ${p.external?'<span class="font-mono text-[10px] uppercase tracking-[.1em] text-down shrink-0">external</span>':''}
      <span class="font-mono text-[11px] text-muted tabular-nums w-16 text-right shrink-0">${ago(p.first_seen)}</span>`)),
      'No listening ports recorded.');
  }
  return `<div class="px-4 py-3">${trustChart(d.history, 680, 200)}</div>`;
}

// ═══════════════════════════ page: alerts
function pageAlerts(){
  const f=state.alertFilter;
  const rows=state.alerts.filter(a=>f==='all'?true:f==='open'?(!a.acknowledged_at&&!a.resolved_at):a.status===f);
  const counts={all:state.alerts.length};
  counts.open=state.alerts.filter(a=>!a.acknowledged_at&&!a.resolved_at).length;
  ['sent','failed','suppressed'].forEach(s=>counts[s]=state.alerts.filter(a=>a.status===s).length);

  const chips=['all','open','sent','failed','suppressed'].map(s=>`
    <button data-alertchip="${s}" class="font-mono text-[10px] uppercase tracking-[.12em] px-2.5 py-1.5 border border-rule -ml-px
      ${f===s?'bg-ink text-paper border-ink':'bg-paper text-muted hover:text-ink'}">${s} ${counts[s]||0}</button>`).join('');

  const tone={critical:'text-down',warning:'text-degraded',info:'text-muted'};

  return `
  <div class="space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <p class="text-sm text-muted max-w-xl">
        Every alert the system generated, and what happened to it.
        <span class="font-mono text-[11px]">suppressed</span> means it was deliberately not sent —
        the node was muted or had no recipients.
      </p>
      <div class="flex">${chips}</div>
    </div>
    ${card(rows.length ? `<div class="divide-y divide-hairline">${rows.map(a=>`
      <div class="px-5 py-3 rise">
        <div class="flex items-center gap-3">
          <span class="font-mono text-[10px] uppercase tracking-[.12em] w-16 shrink-0 ${tone[a.severity]}">${esc(a.severity)}</span>
          <span class="text-sm truncate flex-1">${esc(a.subject)}</span>
          <span class="font-mono text-[11px] text-muted truncate w-32 text-right hidden md:block">${esc(nameOf(a.agent_id))}</span>
          ${statusPill(a.status)}
          <span class="font-mono text-[11px] text-muted tabular-nums w-12 text-right shrink-0">${ago(a.created_at)}</span>
        </div>
        <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1 mt-1 pl-[4.75rem]">
          <span class="font-mono text-[10px] text-muted">rule ${esc(a.rule)}</span>
          ${(a.recipients||[]).length
            ? `<span class="font-mono text-[10px] text-muted truncate">to ${esc((a.recipients||[]).join(', '))}</span>`
            : '<span class="font-mono text-[10px] text-down">no recipients</span>'}
          ${a.error && !String(a.error).startsWith('resend:')
            ? `<span class="font-mono text-[10px] text-down truncate">${esc(a.error)}</span>` : ''}
          ${a.sent_at ? `<span class="font-mono text-[10px] text-healthy">delivered ${ago(a.sent_at)} ago</span>`:''}
          <span class="flex-1"></span>
          ${a.resolved_at
            ? `<span class="font-mono text-[10px] text-healthy">resolved ${ago(a.resolved_at)} ago</span>`
            : a.acknowledged_at
              ? `<span class="font-mono text-[10px] text-muted">acked ${ago(a.acknowledged_at)} ago</span>
                 <button data-resolve="${a.id}" class="font-mono text-[10px] uppercase tracking-[.1em] text-signal hover:underline">Resolve</button>`
              : `<button data-ack="${a.id}" class="font-mono text-[10px] uppercase tracking-[.1em] text-signal hover:underline">Acknowledge</button>
                 <button data-resolve="${a.id}" class="font-mono text-[10px] uppercase tracking-[.1em] text-muted hover:text-signal hover:underline">Resolve</button>`}
        </div>
      </div>`).join('')}</div>`
    : empty(f==='all'?'No alerts yet.':`No ${f} alerts.`))}
  </div>`;
}

// ═══════════════════════════ page: activity
const TABS=[['ports','Ports'],['users','Accounts'],['auth','Sign-ins'],['files','File changes']];
function pageActivity(){
  const counts={ports:state.ports.length,users:state.users.length,
                auth:state.auth.length,files:state.fim.length};
  const tabs=TABS.map(([k,l])=>`
    <button data-tab="${k}" role="tab" aria-selected="${state.tab===k}"
      class="font-mono text-[11px] uppercase tracking-[.14em] px-4 py-2.5 border border-b-0 -mb-px
      ${state.tab===k?'bg-paper border-rule text-ink':'border-transparent text-muted hover:text-ink'}">
      ${l} <span class="text-muted">${counts[k]||0}</span></button>`).join('');
  return `<div><div class="flex items-center gap-1 border-b border-rule">${tabs}</div>
    <div class="bg-paper border border-rule border-t-0">${
      state.tab==='ports'?tabPorts():state.tab==='users'?tabUsers():
      state.tab==='auth'?tabAuth():tabFiles()}</div></div>`;
}
const line = cells => `<div class="flex items-center gap-3 px-5 py-2.5 rise">${cells}</div>`;
const list = (rows,msg) => rows.length
  ? `<div class="divide-y divide-hairline max-h-[32rem] overflow-y-auto">${rows.join('')}</div>` : empty(msg);

function tabPorts(){
  return list(state.ports.map(r=>line(`
    <span class="font-mono text-[10px] uppercase tracking-[.12em] w-14 shrink-0 ${r.action==='opened'?'text-signal':'text-muted'}">${esc(r.action)}</span>

// ═══════════════════════════ page: vulnerabilities
function pageVulns(){
  if(!state.vulns.length) return card(empty(
    'No vulnerabilities recorded yet. Package inventory is collected every 6 hours '
    + 'and resolved against OSV every 10 minutes.'));

  // Group by CVE so one row answers "which hosts does this affect".
  const byVuln={};
  state.vulns.forEach(v=>{
    (byVuln[v.vuln_id] ||= { ...v, packages:new Set(), agents:new Set() });
    byVuln[v.vuln_id].packages.add(`${v.name} ${v.version}`);
    (v.agent_ids||[]).forEach(a=>byVuln[v.vuln_id].agents.add(a));
  });
  const ord={critical:0,high:1,medium:2,low:3,unknown:4};
  const rows=Object.values(byVuln).sort((a,b)=>
    ord[a.severity]-ord[b.severity] || b.agents.size-a.agents.size);

  const tone={critical:'text-down',high:'text-down',medium:'text-degraded',
              low:'text-muted',unknown:'text-muted'};
  const c={critical:0,high:0,medium:0,low:0,unknown:0};
  rows.forEach(r=>c[r.severity]!==undefined&&c[r.severity]++);

  const kpi=(l,v,col)=>`<div class="px-5 py-4">
    <dt class="font-mono text-[9px] tracking-[.18em] uppercase text-muted">${l}</dt>
    <dd class="text-2xl font-semibold tabular-nums leading-none mt-1.5" style="color:${col||'var(--c-ink)'}">${v}</dd></div>`;

  return `<div class="space-y-5">
    <dl class="bg-paper border border-rule grid grid-cols-2 md:grid-cols-5 divide-x divide-hairline">
      ${kpi('Critical',c.critical,c.critical?HEX.down:null)}
      ${kpi('High',c.high,c.high?HEX.down:null)}
      ${kpi('Medium',c.medium,c.medium?HEX.degraded:null)}
      ${kpi('Low',c.low)}
      ${kpi('Unrated',c.unknown)}
    </dl>
    <p class="text-sm text-muted max-w-2xl">
      Resolved against OSV.dev. <span class="font-mono text-[11px]">Unrated</span> means OSV
      carries no severity for that record — it is not counted toward a node's trust score,
      deliberately, rather than being guessed at.
    </p>
    ${card(`<div class="divide-y divide-hairline max-h-[38rem] overflow-y-auto">${rows.map(v=>`
      <div class="px-5 py-3 rise">
        <div class="flex items-center gap-3">
          <span class="font-mono text-[10px] uppercase tracking-[.12em] w-16 shrink-0 ${tone[v.severity]}">${esc(v.severity)}</span>
          <span class="font-mono text-sm truncate w-56 shrink-0">${esc(v.vuln_id)}</span>
          <span class="text-sm text-muted truncate flex-1">${esc(v.summary||'no summary')}</span>
          <span class="font-mono text-[11px] shrink-0 ${v.agents.size?'text-down':'text-muted'}">${v.agents.size} node${v.agents.size===1?'':'s'}</span>
        </div>
        <div class="flex flex-wrap gap-x-4 mt-1 pl-[4.75rem]">
          <span class="font-mono text-[11px] text-muted">${esc([...v.packages].slice(0,3).join(', '))}${v.packages.size>3?` +${v.packages.size-3}`:''}</span>
          ${v.fixed_in?`<span class="font-mono text-[11px] text-healthy">fixed in ${esc(v.fixed_in)}</span>`
                      :'<span class="font-mono text-[11px] text-degraded">no fix listed</span>'}
          ${[...v.agents].length?`<span class="font-mono text-[11px] text-muted">${esc([...v.agents].map(nameOf).join(', '))}</span>`:''}
        </div>
      </div>`).join('')}</div>`)}
  </div>`;
}

// ═══════════════════════════ page: posture
function pagePosture(){
  const byNode={};
  state.checks.forEach(c=>(byNode[c.agent_id] ||= []).push(c));
  const ids=Object.keys(byNode);
  if(!ids.length) return card(empty('Every configuration check is passing on all nodes.'));
  const tone={high:'text-down',medium:'text-degraded',low:'text-muted'};
  const order={high:0,medium:1,low:2};
  return `<div class="space-y-4">${ids.map(id=>{
    const rows=byNode[id].sort((a,b)=>order[a.severity]-order[b.severity]);
    const high=rows.filter(r=>r.severity==='high').length;
    return card(sectionHead(esc(nameOf(id)),
      `<span class="font-mono text-[10px] ${high?'text-down':'text-muted'}">${rows.length} failing${high?` · ${high} high`:''}</span>`)
      + `<div class="divide-y divide-hairline">${rows.map(r=>`
      <div class="px-5 py-2.5 rise">
        <div class="flex items-center gap-3">
          <span class="font-mono text-[10px] uppercase tracking-[.12em] w-14 shrink-0 ${tone[r.severity]}">${esc(r.severity)}</span>
          <span class="text-sm truncate flex-1">${esc(r.title)}</span>
          <span class="font-mono text-[10px] text-muted shrink-0">${esc(r.check_id)}</span>
        </div>
        <p class="font-mono text-[11px] text-muted mt-1 pl-[4.25rem] truncate">${esc(r.detail||'')}</p>
      </div>`).join('')}</div>`);
  }).join('')}</div>`;
}

// ═══════════════════════════ router
function openHost(id){
  state.host=id; state.page='host'; state.hostTab='checks';
  location.hash='#/host/'+id; closeRail();
  loadHostDetail(id).then(render);
  render();
}

const TITLES = {
  host:['Server','Everything collected from this host'],
  servers:['Servers','Select a server to see its detail'],
  alerts:['Alerts','What fired, and whether it was delivered'],
  activity:['Activity','Port, account and sign-in events'],
  posture:['Posture','Failing configuration checks by node'],
  vulns:['Vulnerabilities','Known CVEs across installed packages'],
  settings:['Settings','Global recipients and alert rules'],
};

function render(){
  renderNav();
  const [title,sub]=TITLES[state.page]||TITLES.overview;
  $('page-title').textContent=title;
  $('page-sub').textContent=sub;

  if (state.page==='host') {
    const r=state.hosts.find(h=>h.id===state.host);
    $('page-title').textContent = r ? r.label : 'Node';
    $('page-sub').textContent = r ? r.instance_id : '';
  }
  $('page-actions').innerHTML = state.page==='servers' ? `
    <input id="search" value="${esc(state.query)}" placeholder="Filter servers"
      class="hidden sm:block border border-rule px-3 py-1.5 font-mono text-xs w-44 focus:border-signal outline-none">
    <button id="addnode" class="font-mono text-[11px] uppercase tracking-[.14em] border border-ink px-3 py-1.5 hover:bg-ink hover:text-paper transition-colors">Add</button>`
    : '';

  $('page').innerHTML =
    state.page==='servers'  ? pageServers()  :
    state.page==='alerts'   ? pageAlerts()   :
    state.page==='activity' ? pageActivity() :
    state.page==='posture'  ? pagePosture()  :
    state.page==='host'     ? pageHost()     :
    state.page==='vulns'    ? pageVulns()    : pageSettings();

  bind();
}

function bind(){
  document.querySelectorAll('[data-goto]').forEach(el =>
    el.onclick = () => { state.page=el.dataset.goto; location.hash='#/'+el.dataset.goto; render(); });

  if ($('chips')) {
    $('chips').innerHTML=['all','healthy','degraded','down','pending'].map(o=>`
      <button data-chip="${o}" class="font-mono text-[10px] uppercase tracking-[.12em] px-2.5 py-1.5 border border-rule -ml-px
        ${state.filter===o?'bg-ink text-paper border-ink':'text-muted hover:text-ink'}">${o}</button>`).join('');
    $('chips').querySelectorAll('[data-chip]').forEach(b =>
      b.onclick=()=>{ state.filter=b.dataset.chip; render(); });
  }

  document.querySelectorAll('[data-agent]').forEach(el => {
    const row=state.hosts.find(x=>x.id===el.dataset.agent);
    // On the fleet grid a card opens the node; on the detail page the
    // button opens settings for the node already being viewed.
    const act = state.page==='host' ? ()=>openModal(row) : ()=>openHost(row.id);
    el.onclick=act;
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();act();} };
  });

  document.querySelectorAll('[data-tab]').forEach(el =>
    el.onclick=()=>{ state.tab=el.dataset.tab; render(); });

  document.querySelectorAll('[data-alertchip]').forEach(el =>
    el.onclick=()=>{ state.alertFilter=el.dataset.alertchip; render(); });

  if ($('search')) {
    $('search').addEventListener('input', e => {
      state.query=e.target.value.toLowerCase();
      $('page').innerHTML=pageServers(); bind();
      const s=$('search'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
    });
  }
  if ($('addnode')) $('addnode').onclick=()=>openModal(null);

  document.querySelectorAll('[data-rmglobal]').forEach(el =>
    el.onclick=async()=>{ await sb.from('alert_recipients').delete().eq('id',el.dataset.rmglobal); refresh(); });

  if ($('s-addmail')) {
    $('s-addmail').onclick=async()=>{
      const email=$('s-newmail').value.trim(); if(!email) return;
      const { error } = await sb.from('alert_recipients').insert({ agent_id:null, email });
      if (error) { $('s-msg').textContent = /5 recipients/.test(error.message)
        ? 'At most 5 global recipients.' : /duplicate/i.test(error.message)
        ? 'That address is already global.' : error.message; return; }
      refresh();
    };
    $('s-newmail').addEventListener('keydown',e=>{ if(e.key==='Enter') $('s-addmail').click(); });
  }

  document.querySelectorAll('[data-jump]').forEach(el =>
    el.onclick=()=>openHost(el.dataset.jump));

  document.querySelectorAll('[data-hosttab]').forEach(el =>
    el.onclick=()=>{ state.hostTab=el.dataset.hosttab; render(); });

  document.querySelectorAll('[data-ack]').forEach(el =>
    el.onclick=async e=>{ e.stopPropagation();
      await sb.from('alert_log').update({ acknowledged_at:new Date().toISOString(),
        acknowledged_by:(await sb.auth.getUser()).data.user?.email||'dashboard' })
        .eq('id',el.dataset.ack); refresh(); });

  document.querySelectorAll('[data-resolve]').forEach(el =>
    el.onclick=async e=>{ e.stopPropagation();
      const nowIso=new Date().toISOString();
      await sb.from('alert_log').update({ resolved_at:nowIso, acknowledged_at:nowIso })
        .eq('id',el.dataset.resolve); refresh(); });

  document.querySelectorAll('[data-revoke]').forEach(el =>
    el.onclick=async()=>{ await sb.from('enroll_tokens').update({revoked:true})
      .eq('token',el.dataset.revoke); refresh(); });

  if ($('s-newtoken')) $('s-newtoken').onclick=async()=>{
    const { error } = await sb.rpc('new_enroll_token', { p_label:'issued from dashboard', p_hours:24 });
    if (error && $('s-tokmsg')) $('s-tokmsg').textContent = error.message;
    refresh();
  };

  document.querySelectorAll('[data-rule]').forEach(el =>
    el.onchange=async()=>{ await sb.from('alert_rules').update({enabled:el.checked}).eq('rule',el.dataset.rule); refresh(); });
}

// ═══════════════════════════ node settings modal
let editing=null, emailRows=[];
const modal=()=>$('modal');

function openModal(row){
  editing=row; const adding=!row;
  $('m-eyebrow').textContent=adding?'Register a node':'Node settings';
  $('m-title').textContent=adding?'New node':(row.label||row.instance_id);
  $('m-idfield').classList.toggle('hidden',!adding);
  $('m-mailwrap').classList.toggle('hidden',adding);
  $('m-instance').value='';
  $('m-name').value=row?.display_name||'';
  $('m-notes').value=row?.notes||'';
  $('m-muted').checked=!!row?.muted;
  $('m-msg').textContent='';
  modal().classList.remove('hidden'); modal().classList.add('flex');
  if(!adding) loadEmails(row.id); else emailRows=[];
  setTimeout(()=>(adding?$('m-instance'):$('m-name')).focus(),40);
}
function closeModal(){ modal().classList.add('hidden'); modal().classList.remove('flex'); editing=null; }

async function loadEmails(agentId){
  const { data,error } = await sb.from('alert_recipients')
    .select('id,email,agent_id').or(`agent_id.eq.${agentId},agent_id.is.null`).order('created_at');
  if(error){ $('m-msg').textContent=error.message; return; }
  emailRows=data||[]; renderEmails();
}
function renderEmails(){
  const own=emailRows.filter(e=>e.agent_id);
  $('m-count').textContent=`${own.length} of 5`;
  $('m-emails').innerHTML = emailRows.length ? emailRows.map(e=>`
    <div class="flex items-center gap-2 px-3 py-2">
      <span class="font-mono text-sm truncate flex-1">${esc(e.email)}</span>
      ${e.agent_id?`<button data-rm="${e.id}" class="font-mono text-[11px] text-down hover:underline shrink-0">Remove</button>`
        :'<span class="font-mono text-[10px] uppercase tracking-[.12em] text-muted shrink-0">all nodes</span>'}
    </div>`).join('') : `<p class="px-3 py-4 text-sm text-muted">No recipients. Alerts for this node go nowhere.</p>`;
  $('m-emails').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>removeEmail(b.dataset.rm));
}
async function removeEmail(id){
  const { error } = await sb.from('alert_recipients').delete().eq('id',id);
  if(error){ $('m-msg').textContent=error.message; return; }
  emailRows=emailRows.filter(e=>e.id!==id); renderEmails();
}

$('m-addmail').onclick=async()=>{
  const email=$('m-newmail').value.trim(); $('m-msg').textContent='';
  if(!email||!editing) return;
  const { data,error } = await sb.from('alert_recipients')
    .insert({ agent_id:editing.id, email }).select().single();
  if(error){ $('m-msg').textContent = /5 recipients/.test(error.message)
    ? 'This node already has 5 recipients. Remove one first.'
    : /duplicate/i.test(error.message) ? 'That address is already on this node.' : error.message; return; }
  emailRows.push(data); $('m-newmail').value=''; renderEmails();
};
$('m-newmail').addEventListener('keydown',e=>{ if(e.key==='Enter') $('m-addmail').click(); });

$('m-save').onclick=async()=>{
  $('m-msg').textContent='';
  const patch={ display_name:$('m-name').value.trim()||null,
                notes:$('m-notes').value.trim()||null, muted:$('m-muted').checked };
  let error;
  if(editing){ ({error}=await sb.from('agents').update(patch).eq('id',editing.id)); }
  else {
    const iid=$('m-instance').value.trim();
    if(!/^i-[0-9a-f]{8,}$/.test(iid)){ $('m-msg').textContent='Enter a valid EC2 instance ID, e.g. i-0abc123def456.'; return; }
    ({error}=await sb.from('agents').insert({ instance_id:iid, display_name:patch.display_name, notes:patch.notes }));
  }
  if(error){ $('m-msg').textContent = /duplicate/i.test(error.message)
    ? 'That instance is already registered.' : error.message; return; }
  closeModal(); refresh();
};
$('m-cancel').onclick=closeModal;
$('m-close').onclick=closeModal;
modal().addEventListener('click',e=>{ if(e.target===modal()) closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!modal().classList.contains('hidden')) closeModal(); });

// ═══════════════════════════ host detail loader
async function loadHostDetail(id){
  const since=new Date(Date.now()-24*3600*1000).toISOString();
  try{
    const [checks,pkgs,users,ports,fim,hist]=await Promise.all([
      sb.from('host_checks').select('check_id,title,category,severity,status,detail').eq('agent_id',id),
      sb.from('host_packages').select('name,version,arch').eq('agent_id',id).order('name').limit(1200),
      sb.from('user_state').select('username,uid,shell,sudoer,can_login,password,groups').eq('agent_id',id).order('uid'),
      sb.from('port_state').select('port,proto,bind_addr,external,process,first_seen').eq('agent_id',id).order('port'),
      sb.from('fim_events').select('ts,path,action,critical,sha256,detail').eq('agent_id',id)
        .order('ts',{ascending:false}).limit(80),
      sb.from('trust_history').select('ts,trust,f_recency,f_exposure,f_auth,f_churn,f_posture,f_integrity')
        .eq('agent_id',id).gte('ts',since).order('ts'),
    ]);
    const names=(pkgs.data||[]).map(p=>p.name);
    let vulns={data:[]};
    if(names.length){
      vulns=await sb.from('package_vulns').select('name,version,vuln_id,severity,summary,fixed_in')
        .in('name',names.slice(0,400));
    }
    state.hostDetail={ checks:checks.data||[], packages:pkgs.data||[], users:users.data||[],
      ports:ports.data||[], fim:fim.data||[], history:hist.data||[], vulns:vulns.data||[] };
  }catch(e){ $('err').textContent='Could not load node detail: '+(e.message||e); }
}

// ═══════════════════════════ poll
async function refresh(){
  try{
    const since=new Date(Date.now()-20*60*1000).toISOString();
    const [hosts,latest,hist,ports,auth,checks,users,alerts,recips,rules,tokens,fim,vulns,pkgs]=await Promise.all([
      sb.from('agent_overview').select('*').order('label'),
      sb.from('agent_latest_metrics').select('*'),
      sb.from('metrics').select('agent_id,ts,cpu_pct').gte('ts',since).order('ts'),
      sb.from('port_events').select('ts,port,proto,bind_addr,external,process,action,agents(hostname)')
        .order('ts',{ascending:false}).limit(60),
      sb.from('auth_events').select('ts,kind,username,source_ip,agents(hostname)')
        .order('ts',{ascending:false}).limit(60),
      sb.from('host_checks').select('agent_id,check_id,title,severity,status,detail').eq('status','fail').limit(120),
      sb.from('user_events').select('ts,username,action,uid,sudoer,detail,agents(hostname)')
        .order('ts',{ascending:false}).limit(60),
      sb.from('alert_log').select('id,agent_id,rule,severity,status,subject,recipients,error,created_at,sent_at,acknowledged_at,resolved_at')
        .order('id',{ascending:false}).limit(100),
      sb.from('alert_recipients').select('id,email,agent_id').order('created_at'),
      sb.from('alert_rules').select('rule,severity,cooldown,enabled,description').order('rule'),
      sb.from('enroll_token_status').select('*').order('created_at',{ascending:false}).limit(20),
      sb.from('fim_events').select('ts,path,action,critical,detail,agent_id')
        .order('ts',{ascending:false}).limit(80),
      // Vulnerabilities joined to the hosts running the affected package, so
      // one row can answer "which nodes does this affect".
      sb.from('package_vulns').select('name,version,vuln_id,severity,summary,fixed_in').limit(400),
      sb.from('host_packages').select('agent_id,name,version').limit(4000),
    ]);
    const bad=[hosts,latest,hist,ports,auth,checks,users,alerts,recips,rules,tokens,fim,vulns,pkgs].find(r=>r.error);
    if(bad) throw bad.error;

    state.hosts=hosts.data; state.ports=ports.data; state.auth=auth.data;
    state.checks=checks.data; state.users=users.data; state.alerts=alerts.data;
    state.recipients=recips.data; state.rules=rules.data; state.tokens=tokens.data||[];
    state.fim=fim.data||[];

    // Attach affected hosts to each finding. Done client-side because the
    // join is small and it avoids another view.
    const owners={};
    (pkgs.data||[]).forEach(p=>(owners[p.name+'@'+p.version] ||= []).push(p.agent_id));
    state.vulns=(vulns.data||[]).map(v=>({...v, agent_ids:owners[v.name+'@'+v.version]||[]}))
                                .filter(v=>v.agent_ids.length);
    state.metrics={}; latest.data.forEach(m=>state.metrics[m.agent_id]=m);
    state.series={};  hist.data.forEach(m=>(state.series[m.agent_id] ||= []).push(m.cpu_pct??0));

    if (state.page==='host' && state.host) await loadHostDetail(state.host);
    render();
    $('clock').textContent=new Date().toLocaleTimeString([],{hour12:false});
    $('err').textContent='';
  }catch(e){ $('err').textContent='Could not load telemetry: '+(e.message||e); }
}
</script>
