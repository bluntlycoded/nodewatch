name: Supply chain scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forgeguardian:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # needed to upload SARIF to Code Scanning

    steps:
      - uses: actions/checkout@v4

      - name: Install ForgeGuardian CLI (with grype, trivy, semgrep)
        # SKIP_SERVER: a CI runner is ephemeral and has no business running
        # a persistent server with a default admin password - that's meant
        # for a self-hosted dashboard, not a one-shot scan.
        #
        # The three optional deep-scan engines are intentionally left
        # enabled here (SKIP_ENGINES unset), on trial pending review:
        #   - semgrep (SAST) has real value regardless of this repo's
        #     shape - it reads source, not artifacts.
        #   - grype/trivy scan container and OS-level artifacts; this repo
        #     has no Dockerfile, so on nodewatch itself they likely find
        #     nothing. They matter more for the probe-based supply_chain
        #     check, which can scan arbitrary registered repositories that
        #     do ship containers - installing them here first is how we
        #     see the CI time/value tradeoff before deciding whether the
        #     probe host should carry them too.
        # Revert to SKIP_ENGINES=1 if the added install/scan time isn't
        # worth it for what grype/trivy find on this repo specifically.
        env:
          SKIP_SERVER: "1"
        run: curl -sSfL https://raw.githubusercontent.com/Mah3Sec/ForgeGuardian/main/install.sh | bash

      - name: Scan dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fgctl scan . --ci --fail-on=high --format=sarif > results.sarif

      # ForgeGuardian's SARIF output currently omits `location` on some
      # results, which the SARIF spec requires and GitHub's Code Scanning
      # rejects outright ("expected at least one location"). That's an
      # upstream formatting issue, not something to work around by
      # fabricating locations - so this step is best-effort: the real
      # enforcement is "Scan dependencies" above failing the build on a
      # high-severity finding, which doesn't depend on this succeeding.
      - name: Upload results to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Save raw SARIF for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgeguardian-sarif
          path: results.sarif
          retention-days: 14
