name: Supply chain scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  forgeguardian:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # needed to upload SARIF to Code Scanning

    steps:
      - uses: actions/checkout@v4

      - name: Install ForgeGuardian CLI
        # SKIP_SERVER: a CI runner is ephemeral and has no business running
        # a persistent server with a default admin password - that's meant
        # for a self-hosted dashboard, not a one-shot scan.
        # SKIP_ENGINES: the three optional deep-scan engines (grype, trivy,
        # semgrep) each add their own install step and this repo has no
        # container artifacts for grype/trivy to scan. The five built-in
        # engines (OSV, behavioral, malware pattern, AI model, MCP) run
        # regardless and cover dependency CVEs and malicious-package
        # patterns, which is what actually applies here.
        env:
          SKIP_SERVER: "1"
          SKIP_ENGINES: "1"
        run: curl -sSfL https://raw.githubusercontent.com/Mah3Sec/ForgeGuardian/main/install.sh | bash

      - name: Scan dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fgctl scan . --ci --fail-on=high --format=sarif > results.sarif

      # ForgeGuardian's SARIF output currently omits `location` on some
      # results, which the SARIF spec requires and GitHub's Code Scanning
      # rejects outright ("expected at least one location"). That's an
      # upstream formatting issue, not something to work around by
      # fabricating locations - so this step is best-effort: the real
      # enforcement is "Scan dependencies" above failing the build on a
      # high-severity finding, which doesn't depend on this succeeding.
      - name: Upload results to GitHub Code Scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Save raw SARIF for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgeguardian-sarif
          path: results.sarif
          retention-days: 14
